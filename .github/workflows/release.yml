name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Swip, DMG, and ZIP
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: Swip ${{ github.ref_name || inputs.tag }} — Initial Release
          body_path: RELEASE_NOTES.md
          files: |
            dist/Swip.dmg
            dist/Swip.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
